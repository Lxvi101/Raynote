<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raynote</title>
    <style>
      /* Inline splash — paints on the first frame, before style.css or main.js
         have finished loading. Hidden by main.js once init() completes. */
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(18, 18, 24, 0.82);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.55), 0 2px 12px rgba(0, 0, 0, 0.3);
        -webkit-backdrop-filter: blur(20px) saturate(140%);
        backdrop-filter: blur(20px) saturate(140%);
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
        color: rgba(255, 255, 255, 0.92);
        transition: opacity 260ms ease;
        pointer-events: none;
      }
      #splash.hidden { opacity: 0; }
      .splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      .splash-logo {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.02em;
        background: linear-gradient(135deg, #ffffff 0%, #7c6ff7 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      .splash-bar {
        position: relative;
        width: 140px;
        height: 2px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 1px;
        overflow: hidden;
      }
      .splash-bar::after {
        content: "";
        position: absolute;
        top: 0;
        left: -40%;
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #7c6ff7, transparent);
        animation: splash-slide 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes splash-pulse {
        0%, 100% { opacity: 0.65; }
        50% { opacity: 1; }
      }
      @keyframes splash-slide {
        0% { transform: translateX(0); }
        100% { transform: translateX(350%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-logo { animation: none; opacity: 0.9; }
        .splash-bar::after { animation-duration: 2.4s; }
      }
    </style>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-content">
        <div class="splash-logo">Raynote</div>
        <div class="splash-bar"></div>
      </div>
    </div>
    <div id="app">
      <div id="titlebar" data-tauri-drag-region>
        <div class="titlebar-left">
          <button id="btn-sidebar" class="titlebar-btn" title="Toggle sidebar (Cmd+Shift+S)">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <rect x="1.4" y="2" width="13.2" height="12" rx="2.8" stroke="currentColor" stroke-width="1.2"/>
              <path d="M5.8 2.2V13.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              <rect x="2.6" y="4.6" width="2.3" height="1" rx="0.5" fill="currentColor"/>
              <rect x="2.6" y="6.5" width="2.3" height="1" rx="0.5" fill="currentColor"/>
            </svg>
          </button>
          <span class="titlebar-title" id="titlebar-title">Raynote</span>
          <div id="sticky-tint-picker" class="sticky-tint-picker"></div>
          <div class="titlebar-drag-spacer" data-tauri-drag-region aria-hidden="true"></div>
        </div>
        <div class="titlebar-right">
          <button id="btn-settings" class="titlebar-btn" title="Settings (Cmd+,)">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
              <circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.2"/>
              <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
          </button>
          <button id="btn-pin" class="titlebar-btn" title="Pin on top">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M7 1v8M4 3l3-2 3 2M3 13h8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
          </button>
          <button id="btn-minimize" class="titlebar-btn" title="Minimize">
            <svg width="12" height="12" viewBox="0 0 12 12"><rect y="5" width="12" height="1.5" rx=".75" fill="currentColor"/></svg>
          </button>
          <button id="btn-close" class="titlebar-btn btn-close" title="Close (Cmd+W)">
            <svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>

      <div id="main">
        <aside id="sidebar" class="open">
          <div class="sidebar-header">
            <input type="text" id="search" placeholder="Search notes..." spellcheck="false" />
            <button id="btn-new" class="sidebar-btn" title="New note (Cmd+N)">
              <svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
          </div>
          <ul id="note-list"></ul>
        </aside>

        <div id="editor-area">
          <div id="preview" class="visible"></div>
          <textarea id="editor" spellcheck="false" placeholder="Start writing..."></textarea>
        </div>
      </div>

      <div id="command-palette" class="hidden">
        <div class="palette-backdrop"></div>
        <div class="palette-modal">
          <input type="text" id="palette-input" placeholder="Type a command or search notes..." spellcheck="false" />
          <ul id="palette-results"></ul>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
    <script>
      // Safety net — if init() throws or hangs, drop the splash after 8s so the
      // user is never staring at a frozen loader. Normal path hides it from main.js.
      setTimeout(function () {
        var s = document.getElementById("splash");
        if (s && !s.classList.contains("hidden")) {
          s.classList.add("hidden");
          setTimeout(function () { s.remove(); }, 300);
        }
      }, 8000);
    </script>
  </body>
</html>
