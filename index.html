<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raynote</title>
    <style>
      /* Inline splash — paints on the first frame, before style.css or main.js
         have finished loading. Hidden by main.js once init() completes. */
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 82% 8%, rgba(255, 70, 90, 0.12), transparent 38%),
          rgba(8, 8, 11, 0.88);
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.55), 0 2px 12px rgba(0, 0, 0, 0.3);
        -webkit-backdrop-filter: blur(20px) saturate(140%);
        backdrop-filter: blur(20px) saturate(140%);
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
        color: rgba(255, 255, 255, 0.92);
        transition: opacity 260ms ease;
        pointer-events: none;
      }
      #splash.hidden { opacity: 0; }
      .splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      .splash-logo {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.02em;
        /* Match the red edge-glow accent (rgb(255, 70, 90)) used on
           #app's rim sweep, so boot and the rest of the app feel
           continuous rather than starting purple then switching. */
        background: linear-gradient(135deg, #ffffff 0%, #ff465a 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      .splash-bar {
        position: relative;
        width: 140px;
        height: 2px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 1px;
        overflow: hidden;
        box-shadow: 0 0 12px rgba(255, 70, 90, 0.12);
      }
      .splash-bar::after {
        content: "";
        position: absolute;
        top: 0;
        left: -40%;
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #ff465a, transparent);
        animation: splash-slide 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes splash-pulse {
        0%, 100% { opacity: 0.65; }
        50% { opacity: 1; }
      }
      @keyframes splash-slide {
        0% { transform: translateX(0); }
        100% { transform: translateX(350%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-logo { animation: none; opacity: 0.9; }
        .splash-bar::after { animation-duration: 2.4s; }
      }
    </style>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-content">
        <div class="splash-logo">Raynote</div>
        <div class="splash-bar"></div>
      </div>
    </div>
    <div id="app">
      <div id="main">
        <aside id="sidebar" aria-label="Notes">
          <div class="sidebar-title-row">
            <button id="space-switcher-trigger" class="sidebar-title" type="button" title="Switch space" aria-label="Switch space" aria-haspopup="menu" aria-expanded="false">
              <span>My Notes</span>
              <svg class="space-switcher-chevron" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
                <path d="M3 4.5 6 7.5l3-3" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button id="btn-new" class="sidebar-btn" title="New note (Cmd+N)" aria-label="New note">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div class="sidebar-header">
            <svg class="search-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.25"/>
              <path d="m10.4 10.4 3.1 3.1" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
            </svg>
            <input type="text" id="search" placeholder="Search notes..." spellcheck="false" aria-label="Search notes" />
          </div>
          <ul id="note-list"></ul>
        </aside>

        <section id="note-surface" aria-label="Current note">
          <div id="titlebar">
            <div class="titlebar-left">
              <button id="btn-sidebar" class="titlebar-btn" title="Show notes (Cmd+Shift+S)" aria-label="Show notes" aria-expanded="false">
                <svg width="17" height="17" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                  <rect x="2" y="2.5" width="14" height="13" rx="3" stroke="currentColor" stroke-width="1.25"/>
                  <path d="M6.5 2.8v12.4" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
                  <path d="M3.7 5.5h1.2M3.7 7.8h1.2" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/>
                </svg>
              </button>
              <div class="note-title-chip" role="button" tabindex="0" aria-label="Rename current note">
                <span class="titlebar-title" id="titlebar-title">Raynote</span>
                <input id="titlebar-title-input" class="titlebar-title-input" type="text" aria-label="Note title" autocomplete="off" spellcheck="false" hidden />
              </div>
              <div id="sticky-tint-picker" class="sticky-tint-picker"></div>
              <div class="titlebar-drag-spacer" aria-hidden="true"></div>
            </div>
            <div class="titlebar-right">
              <button id="btn-popout" class="titlebar-btn" title="Float current note" aria-label="Float current note">
                <svg width="17" height="17" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                  <rect x="2.5" y="5" width="10.5" height="10.5" rx="2.5" stroke="currentColor" stroke-width="1.25"/>
                  <path d="M8.5 2.5h7v7M15.2 2.8 9 9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
              <button id="btn-pin" class="titlebar-btn" title="Keep app on top" aria-label="Keep app on top" aria-pressed="false">
                <svg width="17" height="18" viewBox="0 0 318 348" fill="none" aria-hidden="true">
                  <circle cx="155" cy="118" r="66.5" fill="currentColor"/>
                  <path d="M154.5 176.5V251.5" stroke="currentColor" stroke-width="27" stroke-linecap="round"/>
                  <path d="M101.5 230C68 237 48 249 48 264C48 287 96 305 154.5 305C213 305 261 287 261 264C261 249 241 237 208 230" stroke="currentColor" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
              <button id="btn-close" class="titlebar-btn btn-close" title="Close (Cmd+W)" aria-label="Close window">
                <svg width="13" height="13" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1l10 10M11 1 1 11" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg>
              </button>
            </div>
          </div>

          <div id="editor-area">
            <div id="preview" class="visible"></div>
            <textarea id="editor" spellcheck="false" placeholder="Start writing..."></textarea>
          </div>
        </section>
      </div>

      <div id="command-palette" class="hidden">
        <div class="palette-backdrop"></div>
        <div class="palette-modal">
          <input type="text" id="palette-input" placeholder="Type a command or search notes..." spellcheck="false" />
          <ul id="palette-results"></ul>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
